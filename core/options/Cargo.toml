[package]
name = "shurufa-options"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "输入法用户选项（options.json）与打字统计（stats.json）的单一事实源"

[lib]
name = "shurufa_options"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# options.json.modify() 的跨进程文件锁；选 fs4 因为它 API 稳定且 Windows
# LockFileEx 语义在 rename 场景下行为可预期（锁旁路 .lock 文件）。
fs4 = { version = "0.13", features = ["sync"] }
# 打字统计的 UTC 日期用成熟历法实现，替代手写 Hinnant civil-from-days。
chrono = "0.4"
# 原子 JSON 写用 tempfile 生成同目录临时文件再 persist，替代手写 .tmp 命名。
tempfile = "3"
