[package]
name = "ime-ipc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "跨平台 IPC 协议与 DTO（管道传输在 platforms/windows-ipc）"

[lib]
name = "ime_ipc"

[dependencies]
ime-policy = { path = "../ime-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 帧协议用 tokio_util::codec::LengthDelimitedCodec，替代手写 [u32 LE][JSON]。
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
