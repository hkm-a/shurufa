[package]
name = "sync-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "跨设备剪贴板同步：设备身份、配对、mDNS 发现与 TLS 加密传输（平台无关）"

[features]
# stress 压测测试使用真实 TCP+TLS 三设备配对，debug 下跑超过 30s；默认 cargo test 应跳过它
stress-tests = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
mdns-sd = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "tcp_proxy"
path = "examples/tcp_proxy.rs"

[[test]]
name = "stress"
path = "tests/stress.rs"
# stress 测试跑真 TCP+TLS 配对 + 100 条消息同步；
# 默认 cargo test (debug) 里跑会被 tokio multi-thread 启动慢卡超 CI 默认预算，
# 由 sync-stress.ps1 或 --release 显式驱动；本地开发 cargo test 自动跳过。
harness = true
required-features = ["stress-tests"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
