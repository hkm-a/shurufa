# Rime schema (placeholder — wave 4 起被设置中心/安卓键盘的方案选择器引用)
# encoding: utf-8

# 双拼输入方案占位（默认映射目标：小鹤双拼）。选型/词表供 wave 5 引擎侧实装；
# 本文件当前只完成"可被 librime 部署读取的最小骨架"，不参与引擎默认链路。
#
# TODO wave 5: concrete double-pinyin mapping table
#   - speller/algebra 全量映射（多用于小鹤：zh→v, ch→i, sh→u, ai→l, an→j, …）
#   - 与 rime_ice 词典共享 translator.dictionary，或独立 double_pinyin 词典
#   - recognizer/patterns 与 key_binder/import_preset 按雾凇基线对齐
schema:
  schema_id: shurufa_double_pinyin
  name: 双拼
  version: "2026.08.11"
  author:
    - Shurufa
  description: |
    双拼方案占位（默认小鹤映射）；wave 5 填充具体映射表并接入引擎热重部署。
  dependencies:
    - rime_ice

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator

translator:
  # 与拼音共享雾凇核心词典（初始_quality 与拼音方案一致，避免候选质量漂移）
  dictionary: rime_ice
  enable_user_dict: true
  initial_quality: 1.2

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra: []
    # TODO wave 5: 在此追加双拼映射规则（xform/derive/abbrev）

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
