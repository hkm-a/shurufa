# Rime schema (placeholder — wave 4 起被设置中心/安卓键盘的方案选择器引用)
# encoding: utf-8

# 五笔输入方案占位（86 版为默认目标）。映射表与词库实装留给 wave 5；
# 本文件仅满足"可被 librime 部署读取的最小骨架"，暂不参与引擎默认链路。
#
# TODO wave 5: concrete wubi86 code table
#   - translator.dictionary 切换到 wubi86 词典（或独立 shurufa_wubi 词库）
#   - speller/algebra 补 max_code_length=4、auto_select 等五笔习惯
#   - recognizer/patterns 增加五笔法识别模式（四码唯一上屏、`z` 万能键）
schema:
  schema_id: shurufa_wubi
  name: 五笔 86
  version: "2026.08.11"
  author:
    - Shurufa
  description: |
    五笔 86 方案占位；wave 5 填充码表并接入引擎热重部署。
  dependencies:
    - rime_ice

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - table_translator

translator:
  # 暂以雾凇拼音词典占位，供 wave 5 评估是否切换专用五笔库
  dictionary: rime_ice
  enable_user_dict: true
  initial_quality: 1.2

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra: []
    # TODO wave 5: 在此补 max_code_length / auto_select 与 4 码上屏规则

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
