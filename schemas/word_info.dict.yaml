# Rime dictionary - 词汇别名（Shurufa 内置，rime-ice「词汇别名」同款机制）
# encoding: utf-8
#
# 部分常用词自动展示其翻译、别名、化学式、简称等（参考 rime-ice 2025+ 特性）：
# 机制 = 多个词条共享同一个拼音编码 → 输入该编码时一并出现。
# 例：输入 aerfa → 阿尔法（主词库）+ alpha / α / A（本词典别名）。
#
# 词条格式：`词<TAB>编码<TAB>权重`（权重只决定同码候选内部排序）。
# 编码用**紧凑拼音**（aerfa 而非 a er fa）：本词典经 table_translator 挂载，
# 查询走 prism 精确码命中（GetValue），与 script_translator 的音节图匹配
# 不同——紧凑码才是单个 prism key（rime-ice cn_en 同款：X光\tXguang）。
# 由 table_translator@word_info 挂载（initial_quality 0.5，排在拼音候选之后）。

---
