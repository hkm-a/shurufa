<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOX输入法安装界面</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        /* ======= 主内容区（键盘纹理背景） ======= */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 40px;
            position: relative;
            background:
                radial-gradient(ellipse 80% 40% at 50% 100%, rgba(125, 150, 176, 0.16) 0%, transparent 70%),
                repeating-linear-gradient(
                    45deg,
                    rgba(0,0,0,0.015) 0px,
                    rgba(0,0,0,0.015) 2px,
                    transparent 2px,
                    transparent 4px
                ),
                linear-gradient(180deg, #ffffff 0%, #ffffff 20%, #f1eee8 100%);
            z-index: 1;
        }

        /* 底部键盘按键纹理（装饰，淡） */
        .main-area::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 160px;
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(255,255,255,0.5) 0px,
                    rgba(255,255,255,0.5) 4px,
                    transparent 4px,
                    transparent 8px
                ),
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.3) 0px,
                    rgba(255,255,255,0.3) 15px,
                    transparent 15px,
                    transparent 25px
                );
            opacity: 0.6;
            mask-image: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0));
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0));
            pointer-events: none;
            z-index: -1;
        }

        /* Logo 区（狐狸字母 F） */
        .logo-wrapper {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, var(--fox-primary-soft), var(--fox-primary-deep));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-8deg);
            box-shadow: 0 6px 15px rgba(158, 100, 80, 0.25);
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }

        .logo-text {
            color: #fff;
            font-size: 88px;
            font-weight: 800;
            font-family: Arial, sans-serif;
            transform: rotate(8deg); /* 抵消外层旋转 */
            letter-spacing: -6px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.18);
        }

        .main-title {
            color: var(--fox-title);
            font-size: 34px;
            font-weight: 500;
            letter-spacing: 6px;
            margin-bottom: 30px;
            z-index: 2;
        }

        /* 立即安装 */
        .install-btn {
            width: 320px;
            height: 60px;
            background: linear-gradient(135deg, var(--fox-primary-soft), var(--fox-primary));
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 24px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(176, 113, 92, 0.28);
            transition: all 0.2s;
            z-index: 2;
            margin-bottom: 60px;
        }

        .install-btn:hover {
            background: linear-gradient(135deg, var(--fox-primary), var(--fox-primary-deep));
            transform: scale(1.01);
            box-shadow: 0 6px 12px rgba(176, 113, 92, 0.36);
        }

        .install-btn:active {
            transform: scale(0.98);
        }

        /* ======= 底部设置区 ======= */
        .footer {
            padding: 20px 40px 30px 40px;
            background-color: #fff;
            border-top: 1px solid var(--fox-border);
            z-index: 3;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .input-label {
            color: var(--fox-text);
            font-size: 15px;
            width: 85px;
            text-align: right;
            margin-right: 10px;
        }

        .input-field {
            flex: 1;
            height: 32px;
            border: 1px solid var(--fox-border);
            padding: 0 10px;
            font-size: 14px;
            color: var(--fox-text-strong);
            outline: none;
            background: var(--fox-bg);
        }

        .input-field:focus {
            border-color: var(--fox-blue);
        }

        .browse-btn {
            height: 32px;
            padding: 0 18px;
            border: 1px solid var(--fox-border);
            background-color: #fff;
            margin-left: -1px;
            color: var(--fox-text-strong);
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .browse-btn:hover {
            background-color: var(--fox-panel);
            border-color: var(--fox-border);
        }

        .space-info {
            color: var(--fox-text);
            font-size: 13px;
            margin-left: 95px;
            margin-bottom: 16px;
        }

        .space-info span {
            margin-right: 15px;
        }

        .checkbox-group {
            display: flex;
            margin-left: 95px;
            gap: 30px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: var(--fox-text-strong);
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 6px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--fox-primary);
        }

        .agreement-link {
            color: var(--fox-blue);
            text-decoration: none;
            cursor: pointer;
        }

        .agreement-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="window">
        <!-- 标题栏（Tauri 拖拽区，按钮自动豁免） -->
        <div class="title-bar" data-tauri-drag-region>
            <div class="title-left" data-tauri-drag-region>
                <div class="title-icon">F</div>
                <span>FOX输入法 0.5.0 安装向导</span>
            </div>
            <div class="window-controls">
                <button class="control-btn" id="btn-min" title="最小化">—</button>
                <button class="control-btn close" id="btn-close" title="关闭">✕</button>
            </div>
        </div>

        <!-- 主体内容 -->
        <div class="main-area">
            <div class="logo-wrapper">
                <div class="logo-text">F</div>
            </div>

            <div class="main-title">FOX输入法</div>

            <button class="install-btn" id="btn-install">立即安装</button>
        </div>

        <!-- 底部安装选项 -->
        <div class="footer">
            <div class="input-group">
                <div class="input-label">安装位置：</div>
                <input type="text" class="input-field" id="install-dir" value="C:\Program Files\FOX" readonly>
                <button class="browse-btn" id="btn-browse">浏览</button>
            </div>

            <div class="space-info">
                <span>所需空间：约 62MB</span>
                <span id="space-free">可用空间：—</span>
            </div>

            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="agree" checked>
                    已阅读并接受 <a href="#" class="agreement-link" id="eula-link">《最终用户协议》</a>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="startmenu" checked>
                    创建"开始菜单"文件夹
                </label>
            </div>
        </div>
    </div>

    <script type="importmap">
    {"imports":{"@tauri-apps/api/core":"./tauri-api/core.js","@tauri-apps/api/event":"./tauri-api/event.js","@tauri-apps/api/webviewWindow":"./tauri-api/webviewWindow.js"}}
    </script>
    <script type="module">
      // 开发期调试：初始化 tauri-plugin-mcp guest 绑定（MCP 的 DOM/点击/日志工具依赖）
      import("./mcp-plugin.js").then((m) => { if (m.setupPluginListeners) m.setupPluginListeners(); })
        .catch((e) => console.warn("mcp 绑定未初始化", e));
    </script>
    <script src="tauri-global.js"></script>
    <script>
      // 窗口控制（Tauri 全局 API）
      const { getCurrentWindow } = window.__TAURI__.window;
      const { invoke } = window.__TAURI__.core;

      document.getElementById('btn-min').addEventListener('click', () => {
        getCurrentWindow().minimize().catch(console.error);
      });
      document.getElementById('btn-close').addEventListener('click', () => {
        getCurrentWindow().close().catch(console.error);
      });

      // 最终用户协议（轻松版——不透露任何来源信息）
      const EULA = '《FOX输入法 最终用户协议（轻松版）》\n' +
        '\n1. 本协议由一只话痨狐狸用爪子敲定，逐条真实有效（第 9 条除外，它那天心情不好）。\n' +
        '2. FOX输入法按现状免费提供。它努力听懂你的话，偶尔走神——请原谅狐狸。\n' +
        '3. 你可以任意使用、复制、修改本软件，但不得用它换烤鸡。\n' +
        '4. 因输入错误造成的损失（发错消息、打错价格、表白打错名字等），狐狸概不负责。\n' +
        '5. 若本软件让你的打字速度超过同事，请保持低调，以免引发嫉妒。\n' +
        '6. 本协议最终解释权归狐狸所有，狐狸保留随时卖萌的权利。\n' +
        '\n点击"立即安装"即表示你已理解并接受以上条款。';
      document.getElementById('eula-link').addEventListener('click', (e) => {
        e.preventDefault();
        alert(EULA);
      });

      const dirInput = document.getElementById('install-dir');
      const spaceFree = document.getElementById('space-free');

      async function refreshSpace() {
        try {
          const info = await invoke('free_space', { path: dirInput.value });
          spaceFree.textContent = '可用空间：' + (info.free_bytes / 1024 / 1024 / 1024).toFixed(1) + 'GB';
        } catch (err) {
          spaceFree.textContent = '可用空间：—';
        }
      }

      document.getElementById('btn-browse').addEventListener('click', async () => {
        try {
          const dir = await invoke('browse_install_dir');
          if (dir) { dirInput.value = dir; refreshSpace(); }
        } catch (err) { /* 用户取消 */ }
      });

      document.getElementById('btn-install').addEventListener('click', async () => {
        if (!document.getElementById('agree').checked) {
          alert('请先勾选"已阅读并接受最终用户协议"。');
          return;
        }
        localStorage.setItem('install_dir', dirInput.value);
        localStorage.setItem('create_start_menu', String(document.getElementById('startmenu').checked));
        window.location.href = 'installing.html';
      });

      refreshSpace();
    </script>
</body>
</html>
