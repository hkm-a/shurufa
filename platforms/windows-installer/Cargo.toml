[package]
name = "shurufa-installer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shurufa Tauri 安装器（自定义外壳，UI 为 HTML/CSS）"
build = "build.rs"

[[bin]]
name = "FOX-Setup"
path = "src/main.rs"

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# 开发期调试：AI 通过 MCP 直接截 WebView/DOM/点击/看日志。
# 常驻依赖以保 capability(mcp:default) 在 release 也能通过 tauri-build 校验；
# 插件自身在 release 构建下默认拒绝启动 socket server（惰性）。
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp" }
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
