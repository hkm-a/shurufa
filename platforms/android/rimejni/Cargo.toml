[package]
name = "shurufa-rimejni"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Android JNI 桥：把 ime-bridge 暴露给 Kotlin 键盘服务"

[lib]
name = "shurufa_rime"
crate-type = ["cdylib"]

[dependencies]
ime-bridge = { path = "../../../core/ime-bridge" }
sync-core = { path = "../../../core/sync" }
clipboard-store = { path = "../../../core/clipboard" }
tokio = { version = "1", features = ["rt-multi-thread"] }
jni = "0.21"
