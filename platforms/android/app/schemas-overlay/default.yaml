# Rime default settings (Android)
# encoding: utf-8

config_version: '0.50'

# 版本注记：配合 SCHEMA_BUNDLE_VERSION 递增强制重新解包

schema_list:
  - schema: rime_ice
  - schema: shurufa_t9
  - schema: stroke
  - schema: radical_pinyin

switcher:
  caption: 〔方案选单〕
  hotkeys:
    - Control+grave
  save_options:
    - full_shape
    - ascii_punct
    - simplification

menu:
  # 移动端候选栏支持横滑和展开九宫格；保持与数字直选键范围一致。
  page_size: 5

punctuator:
  import_preset: punctuation

key_binder:
  import_preset: key_bindings

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$"
