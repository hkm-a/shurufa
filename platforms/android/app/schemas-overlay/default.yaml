# Rime default settings (Android)
# encoding: utf-8

config_version: '0.50'

# 版本注记：配合 SCHEMA_BUNDLE_VERSION 递增强制重新解包

schema_list:
  - schema: rime_ice
  - schema: shurufa_t9
  - schema: stroke
  - schema: radical_pinyin

switcher:
  caption: 〔方案选单〕
  hotkeys:
    - Control+grave
  save_options:
    - full_shape
    - ascii_punct
    - simplification

menu:
  # P4-5 输入风格预设：引擎每页最多 9 候选，主行显示条数由 UI 按
  # 经典(5)/高效(9) 截断（HorizontalScrollView 横滑浏览）。
  page_size: 9

punctuator:
  import_preset: punctuation

key_binder:
  import_preset: key_bindings

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$"
