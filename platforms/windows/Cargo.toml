[package]
name = "shurufa-tsf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Windows TSF 文本服务前端"

[lib]
name = "shurufa_tsf"
crate-type = ["cdylib"]

[dependencies]
ime-bridge = { path = "../../core/ime-bridge" }
ime-ipc = { path = "../../core/ime-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-registry = "0.6"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
