[package]
name = "shurufa-tsf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Windows TSF 文本服务前端"

[lib]
name = "shurufa_tsf"
crate-type = ["cdylib"]

[dependencies]
# 注意：不要在此声明 ime-bridge。引擎已迁出本进程（由独立算法服务 shurufa-algo
# 提供），TSF DLL 只作瘦客户端经 ime-ipc 走命名管道；直接依赖会把整个 librime
# FFI crate 与其 build.rs（复制 rime.dll）拖回每个宿主进程的依赖图。
ime-ipc = { path = "../../core/ime-ipc" }
windows-ipc = { path = "../windows-ipc" }
windows-skin = { path = "../windows-skin" }
shurufa-options = { path = "../../core/options" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csscolorparser = "0.8"
backoff = "0.4"
windows-registry = "0.6"
windows-core = "0.62"
ureq = "2.12"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
