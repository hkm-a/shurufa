[package]
name = "windows-ipc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Windows 命名管道传输层：ime-ipc 协议在 Windows 上的 Pipe 收发与服务端接入"

[lib]
name = "windows_ipc"

[dependencies]
ime-bridge = { path = "../../core/ime-bridge" }
ime-ipc = { path = "../../core/ime-ipc" }
ime-policy = { path = "../../core/ime-policy" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
] }
