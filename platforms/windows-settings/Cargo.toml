[package]
name = "shurufa-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shurufa Tauri 控制中心"
build = "build.rs"

[[bin]]
name = "Shurufa"
path = "src/main.rs"

[dependencies]
clipboard-store = { path = "../../core/clipboard" }
serde = { version = "1", features = ["derive"] }
sync-core = { path = "../../core/sync" }
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
