[package]
name = "shurufa-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shurufa Windows 原生设置页"

[[bin]]
name = "shurufa-settings"
path = "src/main.rs"

[dependencies]
sync-core = { path = "../../core/sync" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
