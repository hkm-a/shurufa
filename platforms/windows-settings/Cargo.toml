[package]
name = "shurufa-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shurufa Tauri 控制中心"
build = "build.rs"

[[bin]]
name = "Shurufa"
path = "src/main.rs"

[features]
ui-e2e = []

[dependencies]
clipboard-store = { path = "../../core/clipboard" }
serde = { version = "1", features = ["derive"] }
shurufa-options = { path = "../../core/options" }
sync-core = { path = "../../core/sync" }
tauri = { version = "2", features = [] }

[dev-dependencies]
# 测试里需要校验 DTO 的 serde 输出结构
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
