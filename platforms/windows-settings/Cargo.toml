[package]
name = "shurufa-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shurufa Tauri 控制中心"
build = "build.rs"

[[bin]]
name = "Shurufa"
path = "src/main.rs"

[features]
ui-e2e = []
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[dependencies]
clipboard-store = { path = "../../core/clipboard" }
ime-ipc = { path = "../../core/ime-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shurufa-options = { path = "../../core/options" }
sync-core = { path = "../../core/sync" }
meval = "0.2"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
arboard = "3"
# MCP Bridge（hypothesi/mcp-server-tauri）：开发调试用，feature 门控默认关闭
tauri-plugin-mcp-bridge = { version = "0.11", optional = true }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6"

[dev-dependencies]
# 测试里需要校验 DTO 的 serde 输出结构
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
