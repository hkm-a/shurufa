[package]
name = "shurufa-algo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "librime 独立算法服务进程（shurufa-algo）"

[[bin]]
name = "shurufa-algo"
path = "src/main.rs"

[dependencies]
ime-bridge = { path = "../../core/ime-bridge" }
ime-ipc = { path = "../../core/ime-ipc" }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
