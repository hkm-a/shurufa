[package]
name = "shurufa-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Windows 桌面常驻进程：剪贴板监听入库与历史查询 CLI"

[[bin]]
name = "shurufa-host"
path = "src/main.rs"

[dependencies]
clipboard-store = { path = "../../core/clipboard" }
sync-core = { path = "../../core/sync" }
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
paddle-ocr-rs = { version = "0.6.1", default-features = false }
# 上游 0.6.1 以 rc.10 发布；显式固定防止预发布语义解析到不兼容的 rc.13。
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }
windows-capture = "2.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
windows-registry = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
