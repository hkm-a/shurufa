[package]
name = "shurufa-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Windows 桌面常驻进程：按故障域拆分为 clipd/ui/ctl 三个二进制（阶段4）"

[lib]
name = "shurufa_host"
path = "src/lib.rs"

[[bin]]
name = "shurufa-clipd"
path = "src/bin/shurufa-clipd.rs"

[[bin]]
name = "shurufa-ui"
path = "src/bin/shurufa-ui.rs"

[[bin]]
name = "shurufa-ctl"
path = "src/bin/shurufa-ctl.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clipboard-store = { path = "../../core/clipboard" }
ime-ipc = { path = "../../core/ime-ipc" }
windows-ipc = { path = "../windows-ipc" }
windows-skin = { path = "../windows-skin" }
shurufa-options = { path = "../../core/options" }
sync-core = { path = "../../core/sync" }
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
windows-registry = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
ureq = "2.12"
reqwest = { version = "0.12", features = ["blocking", "multipart"] }
eventsource-client = "0.18"
launchdarkly-sdk-transport = "0.1"
futures = "0.3"
csscolorparser = "0.8"
hound = "3"
cpal = "0.15"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
